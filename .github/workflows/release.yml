# 推送 v* tag 时自动构建 Tauri 安装包并创建 GitHub Release。
# 也可在 Actions 页手动运行（workflow_dispatch），为已有 tag 补发 Release。

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "已有 tag 名称（如 v0.1.0）"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

env:
  # tag 推送时用 ref_name；手动触发时用输入的 tag（避免 Windows 上 bash 脚本不可用）
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          - platform: macos-15-intel
            args: --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust_targets: ""
          - platform: windows-latest
            args: ""
            rust_targets: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev pkg-config patchelf \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 注意：勿在此处传入空的 APPLE_* 变量，否则会触发 security import 失败。
          # ad-hoc 签名由 tauri.conf.json 中 macOS.signingIdentity: "-" 负责。
          # 有 Apple 开发者账号时，在仓库 Secrets 配置 APPLE_* 后取消下方注释。
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: "简源 SimplSource v__VERSION__"
          releaseBody: |
            ## 简源 SimplSource v__VERSION__

            轻量数据库客户端（Tauri 2 + React + Rust）。

            ### 下载
            | 系统 | 文件 |
            |------|------|
            | macOS Apple Silicon | `*_aarch64.dmg` |
            | macOS Intel | `*_x64.dmg`（如有） |
            | Windows | `*-setup.exe` 或 `.msi` |
            | Linux | `.deb` / `.AppImage` |

            ### macOS 安装提示（重要）
            GitHub Actions 构建的包已启用 **ad-hoc 签名**。若仍提示「已损坏」，在终端执行：

            ```bash
            xattr -cr /Applications/simplsource.app
            codesign --force --deep --sign - /Applications/simplsource.app
            open /Applications/simplsource.app
            ```

            Apple Silicon 请下载 `*_aarch64.dmg`，Intel Mac 请下载 `*_x64.dmg`。

            ### 功能
            - PostgreSQL / MySQL / SQLite 连接与管理
            - SQL 编辑器与数据浏览
            - SSH 隧道
            - 内联编辑（Safe Mode 事务）
            - CSV / JSON / JSONL / SQL / XLSX 导出，CSV / JSON 导入
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
